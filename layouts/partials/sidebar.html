<div class="fixed inset-0 z-10 hidden bg-gray-900/50 dark:bg-gray-900/90" id="sidebarBackdrop"></div>

<script>
(function() {
  const buttons = document.querySelectorAll('[data-collapse-toggle][aria-controls]');
  const observers = [];

  buttons.forEach(button => {
    const targetId = button.getAttribute('aria-controls');
    const target = document.getElementById(targetId);
    if (!target) return;

    const observer = new MutationObserver(() => {
      const isHidden = target.classList.contains('hidden');
      if (isHidden) {
        button.classList.remove('bg-brand-600', 'dark:bg-brand-600');
      } else {
        button.classList.add('bg-brand-600', 'dark:bg-brand-600');
      }
    });

    observer.observe(target, { attributes: true, attributeFilter: ['class', 'hidden'] });
    observers.push(observer);

    // Estado inicial
    if (!target.classList.contains('hidden')) {
      button.classList.add('bg-brand-600', 'dark:bg-brand-600');
    }
  });
})();
</script>
